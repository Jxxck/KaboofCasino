org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=false

# Input of the resource pack build: the MineVegas Casino 1.1.0 Fabric jar (CurseForge project 1732776, file 9388767).
# It is only read as a zip; none of its code is executed. The build refuses a jar with another SHA-1.
casino.modJar=../Casino-work/mod/minevegas-casino-fabric-26.3-1.1.0.jar
casino.modJarSha1=bd009adf2aed6048efc810a35d0ec3236b851929

# The game-port pack sniffer (pack.serve: minecraft-port) is compiled against Paper's server-side channel listener API
# (io.papermc.paper.network, only in the server jar) and netty from the server's libraries. Read only; nothing of
# them is copied into the plugin or the repository (build/server-api holds an extract of the two API classes).
casino.paperServerJar=/root/Jack_DONT_TOUCH/server/versions/26.3/paper-26.3.jar
casino.serverLibraries=/root/Jack_DONT_TOUCH/server/libraries
casino.nettyVersion=4.2.16.Final

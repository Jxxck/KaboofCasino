org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=false

# Input of the resource pack build: the MineVegas Casino 1.1.0 Fabric jar (CurseForge project 1732776, file 9388767).
# It is not in the repository: the fetchModJar task downloads it once into casino.modJar and checks the SHA-1 (a jar
# you put there yourself is used as it is). It is only read as a zip; none of its code is executed. The build refuses
# a jar with another SHA-1.
casino.modJar=libs/minevegas-casino-fabric-26.3-1.1.0.jar
casino.modJarUrl=https://mediafilez.forgecdn.net/files/9388/767/minevegas-casino-fabric-26.3-1.1.0.jar
casino.modJarSha1=bd009adf2aed6048efc810a35d0ec3236b851929

# netty as Paper 26.3 (build 205) ships it: compile only, for the pack delivery on the game port. After a Paper update
# compare with libraries/io/netty of the server.
casino.nettyVersion=4.2.16.Final

name: KaboofCasino
version: '${version}'
main: de.tigges.kaboofcasino.KaboofCasinoPlugin
api-version: '26.3'
authors: [Jxxck]
description: "Casino for Paper servers without client mods: slot machine, fortune wheel, Plinko, roulette, blackjack, poker, duck derby. Based on MineVegas Casino by byMehd (https://www.curseforge.com/minecraft/mc-mods/minevegas-casino)."
website: https://github.com/Jxxck/KaboofCasino

# Without a permissions plugin: everybody may play, only OPs have kaboofcasino.admin.
permissions:
  kaboofcasino.use:
    description: Use and place casino machines, use /casino.
    default: true
  kaboofcasino.admin:
    description: /casino give, remove, reload; break other players' machines; the croupier's hand.
    default: op

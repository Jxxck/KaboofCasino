# KaboofCasino – all texts (MiniMessage). The games' texts are the ones of the mod's en_us.json.
prefix: "<gold>[Casino]</gold> "

# Cashier: exchange ores for chips, change, prizes. Texts in the menu title (brand, head-*, help-*,
# label-*) are plain text without colours; help-* has at most 5 lines (\n) of about 15 characters each.
# Chip amounts (<value>, <owed>, <price>) come complete with "chip"/"chips" ("1 chip", "1,250 chips").
cashier:
  item: "Cashier"
  item-lore: "<gray>Exchange ores for chips, change, prizes"
  in-use: "<yellow><name> is at this cashier right now."
  brand: "CASHIER"
  tab-exchange: "Exchange"
  tab-exchange-lore: "<gray>Ores for chips"
  tab-change: "Change"
  tab-change-lore: "<gray>Chips into other denominations"
  tab-shop: "Prizes"
  tab-shop-lore: "<gray>Chips for prizes"
  head-exchange: "Exchange ores"
  help-exchange: "Click ores in\nyour inventory.\nLeft: stack\nRight: one more\nShift: all"
  head-change: "Change"
  help-change: "Click chips in\nyour inventory,\nthen pick a\nvalue. Rest in\nsmaller chips."
  head-shop: "Prizes"
  help-shop: "Pick a prize,\nthen BUY.\nChange comes\nback in chips."
  label-value: "Value in chips:"
  label-balance: "Your chips:"
  label-price: "Price:"
  ore-lore: "<gray><count>× = <value>\n<dark_gray>Left: remove · Right: one less"
  chips-lore: "<gray><count> pieces"
  selected-lore: "<gray><count> selected\n<dark_gray>Left: remove · Right: one less"
  target: "Into <denomination> chips"
  target-lore: "<dark_gray>Click here to pick this denomination."
  target-chosen: "<green>Selected"
  rates: "Rates"
  rate-line: "<gray>• </gray><yellow><item></yellow><gray>: <value>"
  rates-lore: "<dark_gray>Only plain stacks without a name,\n<dark_gray>enchantment or other data.\n<red>Chips cannot be exchanged back into ores."
  clear: "Clear selection"
  clear-lore: "<gray>Nothing moves until you exchange."
  exchange-button: "Exchange"
  exchange-lore: "<gray>Exchange for <value>.\n<red>No exchange back!"
  change-lore: "<gray>Change <value> into <denomination> chips.\n<gray>The rest in smaller chips."
  nothing-lore: "<gray>Pick something from your inventory first."
  not-accepted: "<red>The cashier does not take that: <item>."
  not-plain: "<red>Only plain stacks without a name, enchantment or data."
  not-chip: "<red>Only chips count here."
  not-enough: "<red>You no longer have that in your inventory."
  no-room: "<red>There is no room for that in your inventory. Make room first."

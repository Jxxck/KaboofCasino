  idle-closed: "<gray>Menu closed: nothing done for too long. The cashier is free again."
  tray-full: "<yellow>At most 18 kinds at once."

# Leaderboard: boards (wall 2x2 to 6x4, column 1x3) and /casino top. Only rounds played with chips count.
# One round = one game (one spin with all its fields, one duck race with all its ducks, one blackjack hand).
# Win = a round's payout minus its stake; multiplier = payout / stake (from leaderboard.min-stake on).
board:
  item-wall: "Leaderboard (wall board)"
  item-wall-2x2: "Leaderboard (wall board 2×2)"
  item-wall-3x3: "Leaderboard (wall board 3×3)"
  item-wall-4x3: "Leaderboard (wall board 4×3)"
  item-wall-4x4: "Leaderboard (wall board 4×4)"
  item-wall-5x3: "Leaderboard (wall board 5×3)"
  item-wall-5x4: "Leaderboard (wall board 5×4)"
  item-wall-6x4: "Leaderboard (wall board 6×4)"
  item-column: "Leaderboard (column)"
  item-lore: "<gray>The casino's best players, in chips"
  no-wall: "<red>Hang the board on a wall: click the side of a solid block. There has to be wall behind every cell of the board."
  player-below: "<red>Someone is below the board. Hang it up once nobody is underneath."
  # Board: title and subtitle (<period> · <unit>)
  title: "<gold><b><category>"
  subtitle: "<gray><period> · <unit>"
  unit-chips: "in chips"
  unit-multiplier: "stakes from <min>"
  unit-rounds: "rounds"
  empty: "<gray>No entries yet"
  loading: "<gray>Calculating …"
  pinned: "<yellow>This board is set to one fixed page."
  category:
    win: "Biggest win"
    multiplier: "Highest multiplier"
    net: "Net profit"
    staked: "Chips staked"
    rounds: "Most rounds"
    slots: "Slot machine: biggest win"
    wheel: "Fortune wheel: biggest win"
    plinko: "Plinko: biggest win"
    roulette: "Roulette: biggest win"
    blackjack: "Blackjack: biggest win"
    poker: "Poker: biggest win"
    derby: "Duck derby: biggest win"
  period:
    week: "This week"
    total: "All time"
  hidden: "<gray>You no longer appear on the leaderboard. <white>/casino leaderboard on</white> shows you again."
  shown: "<green>You appear on the leaderboard again."
  hide-wait: "<gray>One moment, please. Try again shortly."
  hide-usage: "<gray>/casino leaderboard off|on – hide yourself on the leaderboard or show yourself again."
  top-usage: "<gray>/casino top [<categories>] [week|total]"
  top-header: "<gold>Leaderboard – <category></gold> <gray>(<period>, <unit>)"
  top-line: "<gray><rank>. <white><name></white> – <gold><value>"
  top-empty: "<gray>No entries yet."
  top-loading: "<gray>The leaderboard is being calculated. Try again shortly."
  top-you-hidden: "<dark_gray>You are hidden (/casino leaderboard on)."

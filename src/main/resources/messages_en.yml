  pin-state: "<gray>Category: <white><category></white> · Period: <white><period></white>"
  pin-help: "<gray>Fixed: the board always shows this category or this period. Automatic: it turns to the next page every few seconds, and a right click shows the next category."
  pin-auto-category: "Category: automatic"
  pin-auto-period: "Period: automatic"
  pin-auto: "automatic"
  pin-done: "Done"
  pin-saved: "<green>Leaderboard #<number>: <category>, <period>."
  # The week's winners in the server log (not shown in the game): <week> = "2026-11-03 to 2026-11-09", <lines> = the top 3 of each category
  weekly: "Leaderboard of the week <week>: <lines>"


  holdem-rules: "<gold><b>How Texas Hold'em works</b></gold>\n<gray>You get <white>2 cards of your own</white>, and <white>5 shared cards</white> come to the middle one after another (first 3, then 1, then 1). Your best hand of 5 out of these 7 cards counts.\n<gray>There is a betting round before each new card: <white>Check</white> = go on without a bet, <white>Call</white> = pay what the others bet, <white>Bet/Raise</white> = offer more, <white>Fold</white> = give up (what is in the pot is gone).\n<gray>The small and the big blind are forced bets that move around the table. Whoever has the best hand at the end, or is the last one left, wins the pot.\n<gold>Hands from strong to weak:</gold> <gray>Royal flush, straight flush, four of a kind, full house, flush, straight, three of a kind, two pair, pair, high card.\n<dark_gray>Keys in the menu: 1 = check/call, 2 or F = fold, 3 = bet/raise."
  holdem-busted: "<yellow>You have no chips left at the table."
  holdem-won: "<gray>Poker: <gold><name></gold> wins <gold><chips></gold><hand>."
  holdem-with: " with <hand>"
  holdem-fold-first: "<yellow>Fold first, then leave."

# KaboofCasino settings. The plugin adds new settings to this file by itself when it is updated.

# Language of the casino: texts, item names, number format and the lettering in the resource pack.
#   en: English (messages_en.yml)      de: German (messages_de.yml)
# A change takes effect after a server restart, and every player downloads the pack of that language once.
language: en
# Time zone for the leaderboard's weeks (they start on Monday 00:00) and the shops' daily limits.
#   system: the time zone of the server machine.
#   Or the name of a zone, for example Europe/Berlin, Europe/London or America/New_York.
time-zone: system

pack:
  # Offer the resource pack at all.
  enabled: true
  # Kill switch. false: the pack is only offered, nobody is kicked.
  # Set it to true once the download works from outside (a player from outside your network sees the casino).
  enforce: false
  # Where the pack is served:
  #   minecraft-port: on the Minecraft port itself (HTTP requests are recognised at the start of each connection,
  #                   everything else goes to Minecraft unchanged). No port forward needed.
  #   http-port:      an HTTP server of its own on "port" (has to be forwarded at the gateway).
  serve: minecraft-port
  # Host in the download address http://<url-host>:<port>/pack/<sha1>.zip
  #   auto: every player gets the address they connected with (with serve: minecraft-port including the port).
  #         Works without any further setting as long as players reach this server directly.
  #   Otherwise the server's public address, e.g. play.example.org or an IP. Needed behind a proxy
  #   (Velocity, BungeeCord, TCPShield): there the player's address does not lead to this server; best used
  #   together with serve: http-port.
  url-host: auto
  # Public port in the address with serve: minecraft-port and a fixed url-host (the Minecraft port).
  url-port: 25565
  # Only with serve: http-port: TCP port and bind address of the HTTP server (also the port in the address).
  port: 25580
  bind: 0.0.0.0
  # How long the configuration phase waits for the client's answer (first download, the accept dialog).
  timeout-seconds: 300

bets:
  # Highest stake in chip value, per bet field or per round (see cap-per). Only chips can be staked; ores are
  # exchanged at the cashier (cashier.rates).
  max-stake: 2000
  # slot: max-stake applies to each bet field as in the mod (fortune wheel/Plinko: 3 fields, so up to
  #       3 × max-stake per round).
  # round: all fields of a round together at most max-stake.
  cap-per: slot

rounds:
  # At most this many open bets per player (kept in the player's data). Each bet field counts on its own:
  # a fortune wheel or Plinko round with three fields takes three.
  max-open: 8

owed:
  # Every so many ticks, winnings that did not fit (full inventory) are handed over.
  delivery-ticks: 20

machines:
  # Who may break a machine: owner (whoever placed it, plus OPs) or anyone.
  break: owner
  # Every so many ticks the barrier blocks of loaded machines are checked (/fill, piston exploits).
  verify-ticks: 100
  # Never place a machine where a player logged out (they would wake up inside the barriers and suffocate).
  # Switch off for tests only.
  refuse-logout-spots: true
  # The mod's "Breakable in survival" (Croupier's Hand › Protection). false: nobody outside creative mode can
  # break casino machines; creative mode and /casino remove still remove them.
  breakable: true

safety:
  # No menu while the player took or dealt damage this many seconds ago.
  combat-seconds: 10
  # Monsters within this radius (with line of sight) close the menu.
  monster-radius: 12
  # Primed TNT within this radius closes the menu.
  tnt-radius: 8
  # The danger check runs every so many ticks for players with an open casino menu.
  sweep-ticks: 5

gui:
  # A click on SPIN only counts this many ticks after the menu opened (double-click guard).
  click-guard-ticks: 4
  # A machine menu without a spin closes after this many seconds and frees the machine (0 = never).
  idle-close-seconds: 120

slot:
  # -1 = the mod's odds (RTP 499/512). 0..100 = forced win chance in percent (the mod's CasinoOdds).
  win-chance: -1
  # Refresh the idle lights every so many ticks (0 = off), only while a player is this near.
  idle-light-ticks: 4
  idle-light-range: 16

wheel:
  # Fortune wheel. -1 = the mod's odds (RTP 250/256). 0..100 = forced win chance (the mod's CasinoOdds).
  win-chance: -1
  idle-light-ticks: 4
  idle-light-range: 16

roulette:
  # Roulette. -1 = the mod's odds (RTP 36/37 on each colour). 0..100 = forced win chance (the mod's CasinoOdds:
  # on red/black p/100, on green p/1800).
  win-chance: -1
  # true: at least one of the four cells needs solid ground below (no table above lava or the void).
  # false = as in the mod, no support at all.
  needs-support: true
  # While other players stand at the table, the ball waits this many seconds for their bets (up to 8 players, one
  # spin for all). Alone at the table you spin at once. 0 = always at once, one player per spin.
  # With a forced win-chance there are no shared spins.
  countdown-seconds: 15
  # The roulette has no lights.
  idle-light-ticks: 0
  idle-light-range: 16

blackjack:
  # Blackjack (6 decks, reshuffled below 60 cards, the dealer stands on all 17s, doubling, blackjack pays 3:2).
  # Card bias like the mod's admin setting: 0 = a fair shoe (RTP ~99.5 % with the best strategy). +1..+100 favours
  # the players, -1..-100 the dealer (for each card, with this strength, the better fitting of the two top cards).
  # Blackjack has no win chance in the mod.
  bias: 0
  # While other players stand at the table, the dealer waits this many seconds for their bets (up to 5 seats, one
  # round for all, one dealer). Alone at the table you play at once. 0 = always one player only.
  # With a bias (not 0) there are no shared rounds.
  countdown-seconds: 15
  # true: at least one of the eight cells needs solid ground below (no table above lava or the void).
  # false = as in the mod, no support at all.
  needs-support: true

poker:
  # Poker (Casino Hold'em against the dealer, 1 deck, reshuffled every round, the dealer plays from a pair of
  # fours). Card bias like the mod's admin setting: 0 = a fair deck (RTP ~98.5 % with the mod's strategy).
  # +1..+100 favours the players, -1..-100 the dealer. Poker has no win chance in the mod.
  bias: 0
  # true: at least one of the twelve cells needs solid ground below (no table above lava or the void).
  # false = as in the mod, no support at all.
  needs-support: true
  # Texas Hold'em between the players (No-Limit): while somebody else stands at the table you sit down with chips
  # (up to 3 seats), the dealer only deals, and you play for the others' chips. Alone at the table: Casino Hold'em
  # against the dealer as before. Standing up (LEAVE) pays out the chips at the table.
  holdem:
    enabled: true
    small-blind: 5
    big-blind: 10
    # Buy-in (the chips you sit down with)
    min-buy-in: 100
    max-buy-in: 2000
    # Time for each move; after that: check if possible, else fold
    turn-seconds: 30
    # Wait before the first hand once two are seated, and the pause between two hands
    start-seconds: 10
    next-hand-seconds: 6

lights:
  # Idle lights of all machines together: at most this many updates per tick (in turn). Each update sends all lamp
  # colours of one machine to all players nearby; that keeps the traffic bounded however many machines there are.
  # With few machines the pace of idle-light-ticks applies.
  max-updates-per-tick: 4

plinko:
  # Plinko. -1 = the mod's odds (RTP 998/1024). 0..100 = forced win chance per ball (the mod's CasinoOdds).
  win-chance: -1
  # 63 lamps per update: slower than 4 ticks is not worth the traffic.
  idle-light-ticks: 4
  idle-light-range: 16

derby:
  # Duck derby. -1 = the mod's odds: each of the four ducks wins with 1/4, first place pays 3x, second place
  # returns the stake (RTP 100 %). 0..100 = forced win chance of your own duck, solo only (the mod's CasinoOdds;
  # RTP 3p + (1-p)/3, below 25 with a house edge). Group races exist only at -1 or 25 and always with 1/4.
  win-chance: -1
  # true: at least one of the twelve cells needs solid ground below (no pool above lava or the void).
  # false = as in the mod, no support at all.
  needs-support: true
  # 12 little lamps at the sign (a running light while idle).
  idle-light-ticks: 4
  idle-light-range: 16

music:
  # The mod's lounge music at switched-on casino speakers: 6 pieces by Kevin MacLeod (CC BY 4.0), within 48 blocks
  # of the nearest speaker, full volume up to 12 blocks (the "Jukebox/Note Blocks" slider).
  # It is in a second, optional resource pack (about 22 MB) that is offered only after the casino pack.
  # Declining, an error or no answer never kicks, not even with pack.enforce: true.
  # false: no music pack, no music, no note particles (the speakers keep glowing).
  # For the pack a change applies from the next login, for the music at once after /casino reload.
  enabled: true

jukebox:
  # The casino jukebox (craftable, in the Chip Shop under Tech): 98 tracks in 9 genres, the game's own music
  # (all music discs, overworld, creative, Nether, underwater, the End) and the casino lounge of the music pack.
  # Everybody nearby can choose track, mode and range (16/32/48 blocks); within its range the casino speakers are
  # silent. /casino music off also silences the jukebox. false: all jukeboxes are silent.
  enabled: true

leaderboard:
  # The leaderboard: boards on the wall (2x2 to 6x4) and columns (1x3), plus /casino top. Place them with
  # /casino give leaderboard_wall (3x2), leaderboard_wall_4x4 and so on, or leaderboard_column. Only rounds played
  # with chips count.
  # true: the boards are craftable as well (recipes kaboofcasino:leaderboard_wall and
  # kaboofcasino:leaderboard_column).
  craftable: false
  # The leaderboard is recalculated at most this often (seconds, 30 to 3600), and only if somebody played since.
  refresh-seconds: 30
  # A board without a fixed category turns to the next page every so many seconds (5 to 600; 0 = only by right
  # click). A right click changes the category, the Croupier's Hand sets it for good.
  cycle-seconds: 15
  # The highest multiplier only counts from this stake on (in chips), so 1-chip lucky hits do not beat everything.
  min-stake: 25
  # After each week (Monday 00:00, see time-zone) its winners are written to the server log once.
  weekly-log: true

chipshop:
  # The Chip Shop: casino decoration, furniture, tech, machines, cashier, leaderboards and the shop itself for chips
  # (everything except the croupier's things). Place it with /casino give chip_shop or craft it (recipe
  # kaboofcasino:chip_shop: glass pane, small casino sign, glass pane above black marble bar, chip stacks, black
  # marble bar). false: only with /casino give, like the cashier.
  craftable: true
  # Price = value of the recipe's ingredients in chips x the category's markup, rounded up (below 25 to 1, below
  # 250 to 5, else to 25 chips), at least min-price each. A stack is priced as a whole. Ores count at the cashier's
  # rate (cashier.rates). Categories: floors, furniture, bar, lights, tech, machines, outfits.
  categories:
    floors:
      markup: 1.25
      # each: blocks, stairs, slabs
      min-price: 5
      min-price-stairs: 4
      min-price-slab: 3
    furniture:
      markup: 3.75
      min-price: 5
    bar:
      markup: 3.75
      min-price: 5
    lights:
      markup: 3.75
      min-price: 5
    tech:
      markup: 3.75
      min-price: 5
    machines:
      markup: 1.25
      min-price: 0
    # suits, croupier outfit, evening gown (leather armour values, the look comes from the resource pack)
    outfits:
      markup: 15
      min-price: 50
  # true: the blackjack and the poker table as well (otherwise only with the Croupier's Badge).
  tables: false
  # Values of the other ingredients (chips each; #name = an item tag). A list: entries you delete stay deleted.
  values:
  - item: '#minecraft:planks'
    value: 0.25
  - item: minecraft:dark_oak_planks
    value: 0.25
  - item: '#minecraft:wooden_slabs'
    value: 0.125
  - item: '#minecraft:signs'
    value: 0.54
  - item: minecraft:stick
    value: 0.125
  - item: minecraft:torch
    value: 0.28
  - item: minecraft:black_wool
    value: 1
  - item: minecraft:blue_wool
    value: 1
  - item: minecraft:green_wool
    value: 1
  - item: minecraft:red_wool
    value: 1
  - item: minecraft:white_wool
    value: 1
  - item: minecraft:black_dye
    value: 0.5
  - item: minecraft:green_dye
    value: 0.5
  - item: minecraft:red_dye
    value: 0.5
  - item: minecraft:white_dye
    value: 0.5
  - item: minecraft:yellow_dye
    value: 0.5
  - item: minecraft:leather
    value: 1
  - item: minecraft:paper
    value: 0.5
  - item: minecraft:clay_ball
    value: 0.25
  - item: minecraft:glass
    value: 0.5
  - item: minecraft:green_stained_glass
    value: 0.75
  - item: minecraft:tinted_glass
    value: 2.5
  - item: minecraft:glass_bottle
    value: 0.5
  - item: minecraft:amethyst_shard
    value: 1
  - item: minecraft:calcite
    value: 0.5
  - item: minecraft:glowstone_dust
    value: 1
  - item: minecraft:glowstone
    value: 4
  - item: minecraft:iron_chain
    value: 5
  - item: minecraft:dropper
    value: 2
  - item: minecraft:piston
    value: 6
  - item: roulettecasino:croupier_badge
    value: 384
  # Per item (the Croupier's Hand at the Chip Shop writes this as well): price = fixed price each (0 = automatic),
  # limit = items per player and day (0 = none), hidden: true = not in the shop. Example:
  #   - item: roulettecasino:slot_machine
  #     price: 500
  #     limit: 1
  items: []

cashier:
  # The cashier: exchange ores for chips, change, prize shop. Place it with /casino give cashier.
  # true: craftable as well (recipe kaboofcasino:cashier, unlocked by a cash register:
  #   glass pane | small casino sign | glass pane
  #   black marble bar | cash register | black marble bar).
  craftable: false
  # Exchange rates: chip value per item. Only plain stacks (no name, enchantment or data) count.
  # Chips cannot be exchanged back into ores. A list: entries you delete do not come back.
  rates:
  - item: minecraft:coal
    value: 1
  - item: minecraft:coal_block
    value: 9
  - item: minecraft:copper_ingot
    value: 1
  - item: minecraft:copper_block
    value: 9
  - item: minecraft:redstone
    value: 1
  - item: minecraft:redstone_block
    value: 9

    value: 36
  - item: minecraft:gold_ingot
    value: 8
  - item: minecraft:gold_block
    value: 72
  - item: minecraft:emerald
    value: 16
  - item: minecraft:emerald_block
    value: 144
  - item: minecraft:diamond
    value: 32
  - item: minecraft:diamond_block
    value: 288
  - item: minecraft:netherite_ingot
    value: 256
  - item: minecraft:netherite_block
    value: 2304

shop:
  # Prizes at the cashier. Per prize: item = a casino item (e.g. roulettecasino:casino_chair, casinodeco:...) or a
  # vanilla item, also with components as in /give (e.g. "minecraft:diamond_sword[enchantments={sharpness:5}]");
  # count = amount per purchase (1-64); price = price in chips; limit = purchases per player and day (the date in
  # the time zone above), 0 = unlimited. Chips themselves cannot be a prize. Edit them here (then /casino reload)
  # or in creative mode with the Croupier's Hand at a cashier. A list: entries you delete do not come back.
  # The casino decoration is sold in the Chip Shop; these are the admin's special prizes. Example:
  #   - item: minecraft:diamond_sword[enchantments={sharpness:5}]
  #     count: 1
  #     price: 4000
  #     limit: 1
  items: []

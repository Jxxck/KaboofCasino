# KaboofCasino – Einstellungen. Neue Schlüssel ergänzt das Plugin beim Start selbst.

pack:
  # Ressourcenpaket überhaupt anbieten.
  enabled: true
  # Kill-Switch. false: das Paket wird nur angeboten, niemand wird gekickt.
  # true erst, wenn der Download von außen geprüft ist (render.md 8.5).
  enforce: false
  # Wo das Paket ausgeliefert wird:
  #   minecraft-port: über den Minecraft-Port selbst (HTTP-Anfragen werden am Anfang jeder Verbindung erkannt,
  #                   alles andere geht unverändert an Minecraft). Keine Portweiterleitung nötig.
  #   http-port:      eigener HTTP-Server auf "port" (muss am Gateway weitergeleitet sein).
  serve: minecraft-port
  # Öffentlicher Host in der Download-Adresse http://<url-host>:<Port>/pack/<sha1>.zip
  url-host: 5.9.137.26
  # Öffentlicher Port in der Adresse bei serve: minecraft-port (der Minecraft-Port).
  url-port: 25565
  # Nur bei serve: http-port: TCP-Port und Bind-Adresse des eigenen HTTP-Servers (auch Port in der Adresse).
  port: 25580
  bind: 0.0.0.0
  # So lange wartet die Configuration-Phase auf die Antwort des Clients (erster Download, Annehmen-Dialog).
  timeout-seconds: 300

bets:
  # Höchsteinsatz in Chip-Wert (PLAN-2 C2), je Einsatzfeld oder je Runde (siehe cap-per). Eingesetzt wird nur mit
  # Chips; Erze tauscht man an der Kasse (cashier.rates).
  max-stake: 2000
  # slot: max-stake gilt je Einsatzfeld wie im Mod (Glücksrad/Plinko: 3 Felder, also bis 3 × max-stake pro Runde).
  # round: alle Felder einer Runde zusammen höchstens max-stake.
  cap-per: slot

rounds:
  # Höchstens so viele offene Einsätze pro Spieler (im Spieler-PDC). Jedes Einsatzfeld zählt einzeln:
  # eine Glücksrad- oder Plinko-Runde mit drei Feldern belegt drei.
  max-open: 8

owed:
  # Alle wie viele Ticks offene Gewinne (volles Inventar) nachgeliefert werden.
  delivery-ticks: 20

machines:
  # Wer abbauen darf: owner (wer sie aufgestellt hat, plus OPs) oder anyone.
  break: owner
  # Alle wie viele Ticks die Barrier-Blöcke geladener Maschinen geprüft werden (/fill, Kolben-Exploits).
  verify-ticks: 100
  # Nie eine Maschine dort aufstellen, wo ein Spieler ausgeloggt ist (er würde in den Barrieren erwachen und
  # ersticken). Nur für Tests abschalten.
  refuse-logout-spots: true
  # "Im Überlebensmodus abbaubar" des Mods (Hand des Croupiers › Schutz). false: niemand außerhalb des
  # Kreativmodus kann Casino-Maschinen abbauen; Kreativ und /casino remove entfernen sie weiterhin.
  breakable: true

safety:
  # Kein Menü, solange der Spieler vor so vielen Sekunden Schaden genommen oder ausgeteilt hat.
  combat-seconds: 10
  # Monster in diesem Umkreis (mit Sichtlinie) schließen das Menü.
  monster-radius: 12
  # Gezündetes TNT in diesem Umkreis schließt das Menü.
  tnt-radius: 8
  # Gefahren-Prüfung alle so viele Ticks für Spieler mit offenem Casino-Menü.
  sweep-ticks: 5

gui:
  # Ein Klick auf DREHEN zählt erst so viele Ticks nach dem Öffnen (Doppelklick-Schutz).
  click-guard-ticks: 4
  # Ein Automaten-Menü ohne Dreh schließt nach so vielen Sekunden und gibt den Automaten frei (0 = nie).
  idle-close-seconds: 120

slot:
  # -1 = Quoten wie im Mod (RTP 499/512). 0..100 = erzwungene Gewinnchance in Prozent (CasinoOdds des Mods).
  win-chance: -1
  # Lichter im Leerlauf alle so viele Ticks aktualisieren (0 = aus), nur wenn ein Spieler so nah ist.
  idle-light-ticks: 4
  idle-light-range: 16

wheel:
  # Glücksrad. -1 = Quoten wie im Mod (RTP 250/256). 0..100 = erzwungene Gewinnchance (CasinoOdds des Mods).
  win-chance: -1
  idle-light-ticks: 4
  idle-light-range: 16

roulette:
  # Roulette. -1 = Quoten wie im Mod (RTP 36/37 auf jede Farbe). 0..100 = erzwungene Gewinnchance (CasinoOdds des
  # Mods: auf Rot/Schwarz p/100, auf Grün p/1800).
  win-chance: -1
  # true: mindestens eines der vier Felder braucht festen Boden darunter (Permadeath: kein Tisch über Lava oder
  # Leere). false = wie im Mod, ganz ohne Stütze.
  needs-support: true
  # Das Roulette hat keine Lichter.
  idle-light-ticks: 0
  idle-light-range: 16

blackjack:
  # Blackjack (6 Decks, neu gemischt unter 60 Karten, Croupier steht auf allen 17, Verdoppeln, Blackjack 3:2).
  # Ausrichtung der Karten wie die Admin-Einstellung des Mods: 0 = faires Kartenschlitten (RTP ~99,5 % bei bester
  # Strategie). +1..+100 begünstigt die Spieler, -1..-100 den Croupier (bei jeder Karte mit dieser Stärke die
  # passendere der zwei obersten Karten). Eine Gewinnchance gibt es beim Blackjack im Mod nicht.
  bias: 0
  # true: mindestens eines der acht Felder braucht festen Boden darunter (Permadeath: kein Tisch über Lava oder
  # Leere). false = wie im Mod, ganz ohne Stütze.
  needs-support: true

poker:
  # Poker (Casino Hold'em gegen den Croupier, 1 Deck, jede Runde neu gemischt, Croupier spielt ab Paar Vieren).
  # Ausrichtung der Karten wie die Admin-Einstellung des Mods: 0 = faires Deck (RTP ~98,5 % mit der Strategie des
  # Mods). +1..+100 begünstigt die Spieler, -1..-100 den Croupier. Eine Gewinnchance gibt es beim Poker im Mod nicht.
  bias: 0
  # true: mindestens eines der zwölf Felder braucht festen Boden darunter (Permadeath: kein Tisch über Lava oder
  # Leere). false = wie im Mod, ganz ohne Stütze.
  needs-support: true

lights:
  # Leerlauf-Lichter aller Automaten zusammen: höchstens so viele Updates pro Tick (reihum). Jedes Update schickt
  # alle Lampenfarben eines Automaten an alle Spieler in der Nähe; so bleibt der Verkehr begrenzt, egal wie viele
  # Automaten stehen. Bei wenigen Automaten bleibt es beim Takt aus idle-light-ticks.
  max-updates-per-tick: 4

plinko:
  # Plinko. -1 = Quoten wie im Mod (RTP 998/1024). 0..100 = erzwungene Gewinnchance je Kugel (CasinoOdds des Mods).
  win-chance: -1
  # 63 Lampen pro Update: seltener als 4 Ticks lohnt den Verkehr nicht.
  idle-light-ticks: 4
  idle-light-range: 16

derby:
  # Entenrennen. -1 = Quoten wie im Mod: jede der vier Enten gewinnt mit 1/4, Erster zahlt 3x, Zweiter gibt den
  # Einsatz zurück (RTP 100 %). 0..100 = erzwungene Gewinnchance der eigenen Ente, nur solo (CasinoOdds des Mods;
  # RTP 3p + (1-p)/3, unter 25 mit Hausvorteil). Gruppenrennen gibt es nur bei -1 oder 25 und immer mit 1/4.
  win-chance: -1
  # true: mindestens eines der zwölf Felder braucht festen Boden darunter (Permadeath: kein Becken über Lava oder
  # Leere). false = wie im Mod, ganz ohne Stütze.
  needs-support: true
  # 12 Lämpchen am Schild (Lauflicht im Leerlauf).
  idle-light-ticks: 4
  idle-light-range: 16

music:
  # Lounge-Musik des Mods an eingeschalteten Casino-Lautsprechern: 6 Stücke von Kevin MacLeod (CC BY 4.0), im Umkreis
  # von 48 Blöcken um den nächsten Lautsprecher, bis 12 Blöcke volle Lautstärke (Regler "Jukebox/Notenblöcke").
  # Sie steckt in einem zweiten, freiwilligen Ressourcenpaket (rund 22 MB), das erst nach dem Casino-Paket angeboten
  # wird. Ablehnen, Fehler oder keine Antwort kicken nie, auch nicht mit pack.enforce: true.
  # false: kein Musikpaket, keine Musik, keine Noten-Partikel (die Lautsprecher leuchten weiter).
  # Für das Paket gilt eine Änderung ab dem nächsten Login, für die Musik sofort nach /casino reload.
  enabled: true

cashier:
  # Die Kasse (Schritt 9): Erze in Chips wechseln, Kleingeld, Preis-Shop. Aufstellen: /casino give cashier.
  # true: auch craftbar (Rezept kaboofcasino:cashier, schaltet mit einer Registrierkasse frei:
  #   Glasscheibe | kleines Casino-Schild | Glasscheibe
  #   Theke aus schwarzem Marmor | Registrierkasse | Theke aus schwarzem Marmor).
  craftable: false
  # Kurse beim Wechseln: Chip-Wert pro Item. Nur normale Stapel (ohne Namen, Verzauberung oder Daten) zählen.
  # Chips lassen sich nicht in Erze zurücktauschen. Eine Liste: Einträge, die du löschst, kommen nicht wieder.
  rates:
  - item: minecraft:coal
    value: 1
  - item: minecraft:coal_block
    value: 9
  - item: minecraft:copper_ingot
    value: 1
  - item: minecraft:copper_block
    value: 9
  - item: minecraft:redstone
    value: 1
  - item: minecraft:redstone_block
    value: 9
  - item: minecraft:lapis_lazuli
    value: 2
  - item: minecraft:lapis_block
    value: 18
  - item: minecraft:iron_ingot
    value: 4
  - item: minecraft:iron_block
    value: 36
  - item: minecraft:gold_ingot
    value: 8
  - item: minecraft:gold_block
    value: 72
  - item: minecraft:emerald
    value: 16
  - item: minecraft:emerald_block
    value: 144
  - item: minecraft:diamond
    value: 32
  - item: minecraft:diamond_block
    value: 288
  - item: minecraft:netherite_ingot
    value: 256
  - item: minecraft:netherite_block
    value: 2304

shop:
  # Preis-Shop der Kasse. Je Preis: item = ein Casino-Item (z. B. roulettecasino:casino_chair, casinodeco:...) oder
  # ein Vanilla-Item, auch mit Komponenten wie bei /give (z. B. "minecraft:diamond_sword[enchantments={sharpness:5}]");
  # count = Anzahl pro Kauf (1-64); price = Preis in Chips; limit = Käufe pro Spieler und Tag (Datum in Berlin),
  # 0 = unbegrenzt. Chips selbst sind kein Preis. Bearbeiten: hier (danach /casino reload) oder in Kreativ mit der
  # Hand des Croupiers an einer Kasse. Eine Liste: Einträge, die du löschst, kommen nicht wieder.
  items:
  - item: roulettecasino:casino_chair
    count: 1
    price: 64
    limit: 0
  - item: roulettecasino:casino_stool
    count: 1
    price: 48
    limit: 0
  - item: casinodeco:casino_chip_pile
    count: 1
    price: 32
    limit: 0
  - item: casinodeco:small_casino_sign
    count: 1
    price: 96
    limit: 0
  - item: casinodeco:casino_bottles
    count: 1
    price: 24
    limit: 0
  - item: casinodeco:champagne_coupes
    count: 1
    price: 24
    limit: 0

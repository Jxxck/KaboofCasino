  # Pro Artikel (schreibt auch die Hand des Croupiers am Chip-Shop): price = fester Stückpreis (0 = automatisch),
  # limit = Stück pro Spieler und Tag (0 = keins), hidden: true = nicht im Shop. Beispiel:
  #   - item: roulettecasino:slot_machine
  #     price: 500
  #     limit: 1

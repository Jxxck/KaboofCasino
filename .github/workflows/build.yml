name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The MineVegas Casino jar the resource pack is built from (fetchModJar downloads it when it is missing).
      - uses: actions/cache@v6
        with:
          path: libs
          key: mod-jar-${{ hashFiles('gradle.properties') }}

      - name: Build and test
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: KaboofCasino
          path: |
            build/libs/KaboofCasino-*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error

name: Release

# Pushing a tag v<version> builds that commit, runs the tests and publishes a GitHub release with the plugin jar.
# The tag has to match the version in build.gradle.kts, and CHANGELOG.md needs a section for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/cache@v6
        with:
          path: libs
          key: mod-jar-${{ hashFiles('gradle.properties') }}

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" "build/libs/KaboofCasino-${version}.jar" \
            --verify-tag --title "KaboofCasino ${version}" --notes-file release-notes.md

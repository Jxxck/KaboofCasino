name: Bug report
description: Something in the casino does not work as it should
labels: [bug]
body:
  - type: input
    id: plugin
    attributes:
      label: KaboofCasino version
      description: The line that /version KaboofCasino prints.
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper version
      description: The line that /version prints, for example 26.3-205.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead? Which machine or screen was it?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Server log
      description: The lines of logs/latest.log around the problem, above all lines with [KaboofCasino]. Remove addresses you do not want to show.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Other plugins, a proxy in front of the server, changed settings in config.yml.
